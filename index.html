<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V. Siva Pandi | Software Developer || Data Analyst</title>
    <meta name="description" content="Portfolio of V. Siva Pandi, a skilled Full Stack Developer and Data Analyst specializing in Python, React, and Machine Learning." />
    <meta name="keywords" content="V. Siva Pandi, Software Developer, Data Analyst, Portfolio, React, Python, Machine Learning" />

    <meta property="og:title" content="V. Siva Pandi | Portfolio" />

    <meta property="og:type" content="website" />
    <style>
      #root:empty {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #060b14;
      }
      #root:empty::after {
        content: "";
        width: 50px;
        height: 50px;
        border: 4px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: loading-spin 1s linear infinite;
      }
      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);color:red;padding:20px;display:none;z-index:9999;font-family:monospace;white-space:pre-wrap;overflow:auto;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerHTML += e.error ? e.error.stack : e.message + '\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerHTML += 'Unhandled Promise Rejection: ' + (e.reason ? e.reason.stack || e.reason : e) + '\n';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
